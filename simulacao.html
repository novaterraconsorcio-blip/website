<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulação – Nova Terra Consórcio</title>
  <meta name="description" content="Simule o seu consórcio com calculadora interativa.">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="canonical" href="/simulacao.html">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="/">Nova Terra Consórcio</a>
      <button class="nav-toggle" aria-controls="primary-nav" aria-expanded="false">Menu</button>
      <ul id="primary-nav" class="nav-list">
        <li><a href="como-funciona.html">Como Funciona</a></li>
        <li><a aria-current="page" href="simulacao.html">Simulação</a></li>
        <li><a href="sobre.html">Sobre Nós</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a class="btn btn-primary" href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="section">
      <div class="container grid-2">
        <div class="card">
          <h1>Calculadora</h1>
          <form class="form" data-calc>
            <label>Valor do bem
              <input type="number" name="valor" value="100000" min="1000" step="1000" required>
            </label>
            <label>Prazo (meses)
              <input type="number" name="prazo" value="120" min="12" step="1" required>
            </label>
            <label>Taxa adm. (%)
              <input type="number" name="taxa" value="15" min="0" step="0.1" required>
            </label>
            <button type="submit" class="btn btn-primary">Calcular</button>
            <div class="form-status" aria-live="polite"></div>
          </form>
        </div>
        <div class="card">
          <h2>Resultado</h2>
          <div class="calc-result" data-result>
            <div data-out-parcela></div>
            <div data-out-total></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <strong>Nova Terra Consórcio</strong>
      </div>
      <nav aria-label="Links">
        <ul>
          <li><a href="como-funciona.html">Como Funciona</a></li>

          <li><a href="contato.html">Contato</a></li>
          <li><a href="blog.html">Blog</a></li>
        </ul>
      </nav>
    </div>
  </footer>

    <img src="assets/img/whatsapp.svg" alt="" aria-hidden="true">
    <span class="sr-only">WhatsApp</span>
  </a>
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/calculadora.js" defer></script>
</body>
</html>
